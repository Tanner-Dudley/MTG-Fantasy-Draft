services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mtgdraft
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg -d mtgdraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: mtg-draft
    environment:
      DATABASE_URL: postgresql://mtg:${POSTGRES_PASSWORD}@db:5432/mtgdraft
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata: